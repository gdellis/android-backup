[package]
name = "android-backup"
version = "0.1.0"
edition = "2021"
description = "A Rust tool to backup and restore Android devices using ADB"
license = "MIT"
repository = "https://github.com/gdellis/android-backup"
authors = ["Developer"]

[[bin]]
name = "android-backup"
path = "src/main.rs"

[features]
default = []
blinc-ui = ["blinc_app", "blinc_layout", "blinc_core", "blinc_animation", "blinc_theme"]

[dependencies]
clap = { version = "4.5", features = ["derive", "env"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
tokio = { version = "1.0", features = ["full"] }
indicatif = "0.18.4"
aes-gcm = "0.10"
rand = "0.8"
flate2 = "1.0"
tar = "0.4"
hex = "0.4"
chrono = { version = "0.4", features = ["serde"] }
dirs = "6.0.0"
toml = "0.8"
log = "0.4"
env_logger = "0.11"
thiserror = "2.0.18"
blinc_app = { version = "0.1", optional = true }
blinc_layout = { version = "0.1", optional = true }
blinc_core = { version = "0.1", optional = true }
blinc_animation = { version = "0.1", optional = true }
blinc_theme = { version = "0.1", optional = true }

[target.'cfg(windows)'.dependencies]
winapi = { version = "0.3", features = ["winuser"] }

[profile.release]
opt-level = 3
lto = true
